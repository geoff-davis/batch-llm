name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Permissions needed for coverage action to push to data branch and comment on PRs
permissions:
  contents: write
  pull-requests: write

# Serialize runs that share a ref so back-to-back main pushes don't race the
# coverage action's push to its data branch (the second push would be rejected
# non-fast-forward). Push runs queue (every commit still gets covered); PR runs
# cancel on a newer push to save CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      # [dev] covers everything the test suite needs (pytest, ruff, mypy, ty,
      # and the provider SDKs); --all-extras would also drag in the docs stack
      # (mkdocs, matplotlib) for nothing.
      run: |
        uv sync --extra dev

    # Coverage instrumentation only pays off on the version whose data feeds
    # the coverage comment (3.12); the other matrix legs run plain pytest.
    - name: Run tests with coverage
      if: matrix.python-version == '3.12'
      run: |
        uv run pytest tests/ -v --tb=short --cov --cov-report=term-missing --cov-report=xml

    - name: Run tests
      if: matrix.python-version != '3.12'
      run: |
        uv run pytest tests/ -v --tb=short

    - name: Coverage comment
      uses: py-cov-action/python-coverage-comment-action@v3
      if: matrix.python-version == '3.12'
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    # Lint and type checks are Python-version-independent (ruff targets py310
    # via pyproject; mypy pins python_version = "3.10" there), so they run
    # once here, in parallel with the test matrix, instead of inside the
    # 3.12 test leg where mypy's ~20s sat on the critical path.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --extra dev

    # mypy is incremental: with a restored cache it only rechecks modules
    # whose sources (or dependencies) changed. Keying on github.sha with
    # restore-keys fallbacks means every run saves a fresh cache and the
    # next run restores the closest ancestor.
    - name: Restore mypy cache
      uses: actions/cache@v6
      with:
        path: .mypy_cache
        key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
        restore-keys: |
          mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
          mypy-${{ runner.os }}-

    - name: Run linter
      run: uv run ruff check src/ tests/

    - name: Check formatting
      run: uv run ruff format --check src/ tests/

    - name: Run type checker (mypy)
      run: uv run mypy src/async_batch_llm/ --ignore-missing-imports

    - name: Run type checker (ty)
      run: uv run ty check src/

  openai-compat:
    # The locked SDK exercises the current httpx2 transport in the main test
    # matrix. Keep focused coverage for current releases in both older,
    # httpx-backed SDK major lines allowed by openai>=1.50.0.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: "1.x"
          requirement: "openai>=1.50,<2"
        - label: "2.x"
          requirement: "openai>=2,<3"

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Test OpenAI SDK ${{ matrix.label }} transport compatibility
      run: |
        uv run --isolated --no-project \
          --with-editable . \
          --with "${{ matrix.requirement }}" \
          --with pytest \
          --with pytest-asyncio \
          --with pytest-timeout \
          pytest tests/test_openai_compatible.py tests/test_concurrency_knob.py -q

  scale-smoke:
    # Reduced deterministic scale-soak profile (benchmarks/scale_soak): exact
    # item accounting, bounded queues, replay elimination, retry isolation,
    # WAL lifecycle, and cleanup invariants at CI size. No credentials, no
    # network. The 100k/1m profiles run via the manual scale-benchmark
    # workflow, never per PR.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run reduced scale-soak profile
      run: make scale-smoke

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: scale-soak-ci-report
        path: benchmark-results/scale-ci.json
        if-no-files-found: warn

  docs-build:
    # Catch broken nav/links in PRs instead of discovering them after the
    # post-merge gh-pages deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --extra docs

    - name: Build docs (strict)
      run: uv run mkdocs build --strict

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    # No `uv sync` here: `uv export --frozen` reads the lockfile directly and
    # pip-audit runs as an isolated uv tool, so the project env is never used.
    - name: Python security audit
      # Audit the project's locked runtime deps only, not pip-audit's own
      # venv (which pulls in pip and would report CVEs in pip itself —
      # those aren't vulnerabilities users of async-batch-llm are exposed to).
      run: |
        uv export --frozen --format requirements.txt --no-dev \
          --no-emit-project -o /tmp/abl-deps.txt
        uv tool install pip-audit
        uv tool run pip-audit --disable-pip --require-hashes -r /tmp/abl-deps.txt

    - name: Set up Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: '20'

    - name: Install npm dependencies
      run: npm ci

    - name: NPM security audit
      run: npm audit --audit-level=moderate
